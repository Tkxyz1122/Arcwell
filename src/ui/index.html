<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>Arcwell</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-symbol" data-icon="bookmark"></span>
        <div><strong>Arcwell</strong><small>A HOME FOR YOUR LINKS</small></div>
      </div>
      <label class="search"
        ><span data-icon="search"></span
        ><input id="search" placeholder="搜索收藏" aria-label="搜索收藏" /><kbd>Ctrl K</kbd></label
      >
      <nav id="navigation" aria-label="收藏导航"></nav>
      <div class="folder-heading">
        <span>文件夹</span
        ><button class="icon-button" id="new-folder" title="新建文件夹" aria-label="新建文件夹">
          <span data-icon="plus"></span>
        </button>
      </div>
      <nav id="folders" aria-label="文件夹分类"></nav>
      <div class="sidebar-footer">
        <span class="local" id="save-status"><i></i><span>本地保存</span></span>
        <div class="footer-actions">
          <button
            class="icon-button"
            id="import-bookmarks"
            title="导入浏览器收藏（HTML）"
            aria-label="导入 HTML"
          >
            <span data-icon="import"></span>
          </button>
          <button class="icon-button" id="settings" title="设置与备份" aria-label="设置与备份">
            <span data-icon="settings"></span>
          </button>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="titlebar">
        <span>Arcwell <em>/</em> 我的收藏</span>
        <div>
          <button data-window="minimize" aria-label="最小化"><span data-icon="minus"></span></button
          ><button data-window="maximize" aria-label="最大化或还原">
            <span data-icon="square"></span></button
          ><button data-window="close" aria-label="关闭窗口">
            <span data-icon="close"></span>
          </button>
        </div>
      </header>
      <div class="columns">
        <main>
          <div class="breadcrumb">
            <span data-icon="folder"></span><span>我的收藏</span><span>/</span
            ><strong id="breadcrumb-name">全部收藏</strong>
          </div>
          <div class="page-header">
            <div>
              <h1 id="page-title">全部收藏</h1>
              <p>整理好每一个值得留下的网页。</p>
            </div>
            <button class="primary" id="add-header"><span data-icon="plus"></span>添加网址</button>
          </div>
          <form id="quick-add" class="quick-add">
            <span data-icon="link"></span
            ><input
              id="quick-url"
              maxlength="4096"
              placeholder="输入网址，使用默认浏览器打开…"
              aria-label="输入要打开的网址"
            /><button class="primary" type="submit">打开</button>
          </form>
          <div class="toolbar">
            <div class="toolbar-left">
              <strong>所有链接 <span class="count" id="result-count">0</span></strong
              ><button class="tab active" id="all-tab">全部</button
              ><button class="tab" id="star-tab">星标</button>
            </div>
            <div class="toolbar-right">
              <button
                id="folder-menu"
                class="icon-button"
                type="button"
                aria-label="管理文件夹"
                hidden
              >
                <span data-icon="more"></span>
              </button>
              <label class="sort"
                ><span data-icon="sort"></span
                ><select id="sort" aria-label="排序">
                  <option value="recent">最近添加</option>
                  <option value="name">名称排序</option>
                </select></label
              >
              <div class="view-switch">
                <button id="list-view" class="icon-button active" aria-label="列表视图">
                  <span data-icon="list"></span></button
                ><button id="grid-view" class="icon-button" aria-label="网格视图">
                  <span data-icon="grid"></span>
                </button>
              </div>
            </div>
          </div>
          <div id="bookmark-list" class="bookmark-list" aria-label="收藏列表"></div>
          <footer class="main-footer">菜单编辑详情 <span>·</span> 单击打开网页</footer>
        </main>
        <aside id="inspector" class="inspector" aria-label="链接详情" hidden></aside>
      </div>
    </div>
    <dialog id="modal">
      <form id="modal-form">
        <div class="dialog-heading">
          <h2 id="modal-title"></h2>
          <button type="button" id="modal-close" class="icon-button" aria-label="关闭对话框">
            <span data-icon="close"></span>
          </button>
        </div>
        <div id="modal-content"></div>
        <p class="form-error" id="modal-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="modal-cancel" class="secondary">取消</button
          ><button id="modal-submit" type="submit" class="primary">确认</button>
        </div>
      </form>
    </dialog>
    <div id="context-menu" class="context-menu" hidden></div>
    <div id="toast" role="status" class="toast" hidden></div>
    <script src="../folders.js"></script>
    <script src="app.js"></script>
  </body>
</html>
